<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Wealth Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #9a8fc2;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        .control-group {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 18px 20px;
            transition: border-color 0.2s;
        }
        .control-group:hover { border-color: rgba(123,47,247,0.4); }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b0a8d0;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #7b2ff7; }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.12);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(123,47,247,0.4);
        }

        .slider-value {
            min-width: 110px;
            text-align: right;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .slider-value .sub {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: #9a8fc2;
        }

        .chart-wrap {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 24px 24px 16px;
        }

        .chart-container { position: relative; height: 420px; }

        .summary {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label {
            font-size: 0.78rem;
            color: #9a8fc2;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .green { color: #4ade80; }
        .blue  { color: #60a5fa; }
        .amber { color: #fbbf24; }
        .red   { color: #f87171; }

        @media (max-width: 700px) {
            body { padding: 14px; }
            h1 { font-size: 1.4rem; }
            .controls { grid-template-columns: 1fr; }
            .summary { gap: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Retirement Wealth Planner</h1>
    <p class="subtitle">All returns shown net of inflation &mdash; adjust inputs and watch your projection update in real time.</p>

    <!-- Row 1: Numeric inputs -->
    <div class="controls">
        <div class="control-group">
            <label for="netWorth">Current Net Worth ($)</label>
            <input type="text" id="netWorth" value="1,000,000">
        </div>
        <div class="control-group">
            <label for="income">Annual Income ($)</label>
            <input type="text" id="income" value="250,000">
        </div>
        <div class="control-group">
            <label for="retirementSpending">Annual Spending in Retirement ($)</label>
            <input type="text" id="retirementSpending" value="150,000">
        </div>
    </div>

    <!-- Row 2: Sliders -->
    <div class="controls" style="margin-bottom: 28px;">
        <div class="control-group">
            <label for="savingsRate">Savings Rate (pre-retirement)</label>
            <div class="slider-wrap">
                <input type="range" id="savingsRate" min="0" max="80" value="20" step="1">
                <span class="slider-value" id="savingsRateVal">20%</span>
            </div>
        </div>
        <div class="control-group">
            <label for="retireAge">Target Retirement Age</label>
            <div class="slider-wrap">
                <input type="range" id="retireAge" min="45" max="80" value="65" step="1">
                <span class="slider-value" id="retireAgeVal">Ave. Age 65<span class="sub" id="retireYearHint">(Year 2053)</span></span>
            </div>
        </div>
        <div class="control-group">
            <label for="returnRate">Annual Return, Net of Inflation</label>
            <div class="slider-wrap">
                <input type="range" id="returnRate" min="0" max="10" value="3" step="0.5">
                <span class="slider-value" id="returnRateVal">3.0%</span>
            </div>
        </div>
    </div>

    <div class="chart-wrap">
        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>
        <div class="summary" id="summary"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

const START_YEAR     = 2026;
const END_YEAR       = 2090;
const JON_AGE_2026   = 40;
const GRACE_AGE_2026 = 37;

function ages(year) {
    const d = year - START_YEAR;
    const jon   = JON_AGE_2026 + d;
    const grace = GRACE_AGE_2026 + d;
    const avg   = Math.ceil((jon + grace) / 2);
    return { jon, grace, avg };
}

function ageToYear(age) {
    return Math.round(START_YEAR + age - 38.5);
}

// ── Number input formatting ───────────────────────────────────────────────────
function parseNum(s) {
    return parseFloat(String(s).replace(/,/g, '')) || 0;
}
function formatNum(n) {
    const v = parseNum(n);
    return isNaN(v) ? '' : v.toLocaleString('en-US');
}

['netWorth', 'income', 'retirementSpending'].forEach(id => {
    const el = $(id);
    el.addEventListener('focus', function() { this.value = String(parseNum(this.value) || ''); });
    el.addEventListener('blur',  function() {
        const n = parseNum(this.value);
        if (n > 0) this.value = formatNum(n);
        compute();
    });
    el.addEventListener('keydown', function(e) { if (e.key === 'Enter') this.blur(); });
});

// ── Tick years: evenly spaced every 5 years, 2030–2090, plus 2026 at start ───
const tickYears = [START_YEAR];
for (let y = 2030; y <= END_YEAR; y += 5) tickYears.push(y);

// ── Shared: rounded rect path ─────────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// ── Age axis plugin ───────────────────────────────────────────────────────────
const ROW_H = 17;

const ageAxisPlugin = {
    id: 'ageAxis',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !y) return;

        ctx.save();
        ctx.textAlign    = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '10px system-ui, sans-serif';

        const baseY = x.bottom + 6;

        tickYears.forEach(year => {
            const xPos = x.getPixelForValue(year);
            const { jon, grace, avg } = ages(year);

            ctx.fillStyle = '#60a5fa';
            ctx.fillText(jon,   xPos, baseY);

            ctx.fillStyle = '#f9a8d4';
            ctx.fillText(grace, xPos, baseY + ROW_H);

            // Separator line above avg
            ctx.strokeStyle = 'rgba(167,139,250,0.25)';
            ctx.lineWidth = 0.75;
            ctx.beginPath();
            ctx.moveTo(x.left,  baseY + ROW_H * 2 - 3);
            ctx.lineTo(x.right, baseY + ROW_H * 2 - 3);
            ctx.stroke();

            ctx.fillStyle = '#a78bfa';
            ctx.fillText(avg, xPos, baseY + ROW_H * 2);
        });

        // Row labels — drawn well left of the y-axis area
        const labelX = y.left - 8;
        ctx.textAlign = 'right';
        ctx.font = '9px system-ui, sans-serif';
        ctx.fillStyle = '#60a5fa';  ctx.fillText('Jon',   labelX, baseY);
        ctx.fillStyle = '#f9a8d4';  ctx.fillText('Grace', labelX, baseY + ROW_H);
        ctx.fillStyle = '#a78bfa';  ctx.fillText('Avg',   labelX, baseY + ROW_H * 2);

        ctx.restore();
    }
};

// ── Retirement line plugin ────────────────────────────────────────────────────
const retireLinePlugin = {
    id: 'retireLine',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !chart._retireYear) return;
        const xPos = x.getPixelForValue(chart._retireYear);
        if (xPos < x.left || xPos > x.right) return;

        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = 'rgba(251,191,36,0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(xPos, y.top);
        ctx.lineTo(xPos, y.bottom);
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.font = 'bold 11px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        const text = 'Retirement';
        const tw = ctx.measureText(text).width;
        const ph = 18, pw = tw + 16;
        const py = y.top + 6;
        const px = xPos - pw / 2;
        roundRect(ctx, px, py, pw, ph, 5);
        ctx.fillStyle = 'rgba(20,14,50,0.85)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(251,191,36,0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.fillStyle = 'rgba(251,191,36,0.95)';
        ctx.fillText(text, xPos, py + ph / 2);
        ctx.restore();
    }
};

// ── Depletion line plugin ─────────────────────────────────────────────────────
const depletionLinePlugin = {
    id: 'depletionLine',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !chart._depletedYearPrecise) return;

        // Line at the precise zero-crossing (aligns with chart color change)
        const xPos = x.getPixelForValue(chart._depletedYearPrecise);
        if (xPos < x.left || xPos > x.right) return;

        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = 'rgba(248,113,113,0.65)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(xPos, y.top);
        ctx.lineTo(xPos, y.bottom);
        ctx.stroke();
        ctx.setLineDash([]);

        // Bubble — styled to mirror the age table below
        const { jon, grace, avg } = ages(chart._depletedYear);
        const yr = chart._depletedYear;

        const pad   = 9;
        const lineH = 16;
        const sepH  = 8;  // gap around separator
        const bw    = 126;
        // rows: year header, Jon, Grace, sep, Avg
        const bh = pad + lineH + lineH + lineH + sepH + lineH + pad;
        const bx = xPos - bw / 2;
        const by = y.top + 6;

        roundRect(ctx, bx, by, bw, bh, 6);
        ctx.fillStyle = 'rgba(20,14,50,0.88)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(248,113,113,0.6)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        let rowY = by + pad + lineH / 2;

        // Year header
        ctx.font = 'bold 12px system-ui, sans-serif';
        ctx.fillStyle = '#f87171';
        ctx.fillText(yr, xPos, rowY);
        rowY += lineH;

        // Jon
        ctx.font = '10px system-ui, sans-serif';
        ctx.fillStyle = '#60a5fa';
        ctx.fillText(`Jon  ${jon}`, xPos, rowY);
        rowY += lineH;

        // Grace
        ctx.fillStyle = '#f9a8d4';
        ctx.fillText(`Grace  ${grace}`, xPos, rowY);
        rowY += lineH + sepH / 2;

        // Separator line
        ctx.strokeStyle = 'rgba(167,139,250,0.3)';
        ctx.lineWidth = 0.75;
        ctx.beginPath();
        ctx.moveTo(bx + 10, rowY);
        ctx.lineTo(bx + bw - 10, rowY);
        ctx.stroke();
        rowY += sepH / 2;

        // Avg
        ctx.font = '10px system-ui, sans-serif';
        ctx.fillStyle = '#a78bfa';
        ctx.fillText(`Avg  ${avg}`, xPos, rowY + lineH / 2);

        ctx.restore();
    }
};

// ── Chart setup ───────────────────────────────────────────────────────────────
const canvasEl = $('chart');
const ctx = canvasEl.getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    plugins: [ageAxisPlugin, retireLinePlugin, depletionLinePlugin],
    data: { datasets: [{ label: 'Net Worth', data: [], pointRadius: 0, pointHoverRadius: 0 }] },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 36, bottom: 60, left: 52 } },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: 'rgba(30,20,60,0.92)',
                titleColor: '#b0a8d0',
                bodyColor: '#fff',
                bodyFont: { size: 13, weight: '600' },
                padding: 12,
                cornerRadius: 10,
                callbacks: {
                    title: items => {
                        const year = Math.round(items[0].parsed.x);
                        const { jon, grace, avg } = ages(year);
                        return `${year}  ·  Jon ${jon}  Grace ${grace}  Avg ${avg}`;
                    },
                    label: item => {
                        const v = item.parsed.y;
                        return (v >= 0 ? '$' : '-$') +
                            Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
                    }
                }
            }
        },
        scales: {
            x: {
                type: 'linear',
                min: START_YEAR,
                max: END_YEAR,
                // Ticks built once at init; afterBuildTicks overrides every cycle
                // so we use beforeUpdate to keep them frozen instead
                beforeUpdate(axis) {
                    axis.options.ticks.maxTicksLimit = tickYears.length + 1;
                },
                afterBuildTicks(axis) {
                    axis.ticks = tickYears.map(v => ({ value: v }));
                },
                ticks: {
                    maxRotation: 0,
                    color: '#8a80b0',
                    callback: val => val,
                },
                grid: { color: 'rgba(255,255,255,0.04)' },
            },
            y: {
                ticks: {
                    color: '#8a80b0',
                    callback: v => {
                        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
                        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(0) + 'K';
                        return v;
                    }
                },
                grid: { color: 'rgba(255,255,255,0.04)' },
            }
        }
    }
});

// ── Compute & render ──────────────────────────────────────────────────────────
function compute() {
    const netWorth0   = parseNum($('netWorth').value);
    const income      = parseNum($('income').value);
    const returnPct   = parseFloat($('returnRate').value) / 100;
    const savePct     = parseInt($('savingsRate').value) / 100;
    const retireAge   = parseInt($('retireAge').value);
    const retireSpend = parseNum($('retirementSpending').value);
    const retireYear  = ageToYear(retireAge);

    // Update slider displays
    $('savingsRateVal').textContent = $('savingsRate').value + '%';
    $('returnRateVal').textContent  = parseFloat($('returnRate').value).toFixed(1) + '%';
    $('retireAgeVal').childNodes[0].textContent = 'Age ' + retireAge;
    $('retireYearHint').textContent = '(Year ' + retireYear + ')';

    const data = [];
    let nw = netWorth0;
    let peakNW = nw, peakYear = START_YEAR, depletedYear = null;

    for (let y = START_YEAR; y <= END_YEAR; y++) {
        data.push({ x: y, y: Math.round(nw) });
        if (nw > peakNW) { peakNW = nw; peakYear = y; }
        if (nw <= 0 && y >= retireYear && !depletedYear) depletedYear = y;

        if (y < retireYear) {
            nw = (nw + income * savePct) * (1 + returnPct);
        } else {
            nw = (nw - retireSpend) * (1 + returnPct);
        }
    }

    // Interpolate precise zero-crossing so the dashed line aligns with the color change
    let depletedYearPrecise = null;
    if (depletedYear !== null && depletedYear > START_YEAR) {
        const d0 = data[depletedYear - 1 - START_YEAR];
        const d1 = data[depletedYear - START_YEAR];
        if (d0 && d1 && d0.y > 0) {
            depletedYearPrecise = d0.x + d0.y / (d0.y - d1.y);
        } else {
            depletedYearPrecise = depletedYear;
        }
    }

    // Gradient
    const gradient = ctx.createLinearGradient(0, 0, 0, canvasEl.clientHeight);
    gradient.addColorStop(0, 'rgba(123,47,247,0.28)');
    gradient.addColorStop(1, 'rgba(123,47,247,0.0)');

    const ds = chart.data.datasets[0];
    ds.data             = data;
    ds.borderColor      = '#7b2ff7';
    ds.backgroundColor  = gradient;
    ds.fill             = true;
    ds.pointRadius      = 0;
    ds.pointHoverRadius = 0;
    ds.borderWidth      = 3;
    ds.tension          = 0.3;
    ds.segment          = { borderColor: seg => seg.p1.parsed.y < 0 ? '#f87171' : '#7b2ff7' };

    chart._retireYear           = retireYear;
    chart._depletedYear         = depletedYear;
    chart._depletedYearPrecise  = depletedYearPrecise;
    chart.update('none');

    // Summary stats
    const retireNW       = data[Math.min(retireYear - START_YEAR, data.length - 1)]?.y ?? 0;
    const yearsOfWealth  = depletedYear ? depletedYear - retireYear : '∞';
    const depletedAge    = depletedYear ? ages(depletedYear).avg : null;

    const fmt = v => {
        const neg = v < 0, a = Math.abs(v);
        const s = a >= 1e6 ? '$' + (a / 1e6).toFixed(1) + 'M'
                : a >= 1e3 ? '$' + (a / 1e3).toFixed(0) + 'K'
                : '$' + a.toLocaleString();
        return neg ? '-' + s : s;
    };

    $('summary').innerHTML = `
        <div class="stat">
            <div class="stat-value green">${fmt(peakNW)}</div>
            <div class="stat-label">Peak Net Worth (${peakYear})</div>
        </div>
        <div class="stat">
            <div class="stat-value blue">${fmt(retireNW)}</div>
            <div class="stat-label">Net Worth at Retirement</div>
        </div>
        <div class="stat">
            <div class="stat-value ${depletedYear ? 'red' : 'green'}">${depletedYear ? depletedYear + ' (avg age ' + depletedAge + ')' : 'Never'}</div>
            <div class="stat-label">Money Runs Out</div>
        </div>
        <div class="stat">
            <div class="stat-value amber">${yearsOfWealth === '∞' ? '∞' : yearsOfWealth + ' yrs'}</div>
            <div class="stat-label">Years of Retirement Funded</div>
        </div>
    `;
}

['savingsRate', 'retireAge', 'returnRate'].forEach(id => $(id).addEventListener('input', compute));

compute();
</script>

</body>
</html>
