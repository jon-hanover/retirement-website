<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Wealth Planner</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 24px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            background: linear-gradient(90deg, #00d2ff, #7b2ff7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            color: #9a8fc2;
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 18px;
        }

        .control-group {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 18px 20px;
            transition: border-color 0.2s;
        }
        .control-group:hover { border-color: rgba(123,47,247,0.4); }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b0a8d0;
            margin-bottom: 10px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 10px;
            background: rgba(0,0,0,0.3);
            color: #fff;
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus { border-color: #7b2ff7; }

        .slider-wrap { display: flex; align-items: center; gap: 14px; }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.12);
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px; height: 22px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d2ff, #7b2ff7);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(123,47,247,0.4);
        }

        .slider-value {
            min-width: 110px;
            text-align: right;
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }
        .slider-value .sub {
            display: block;
            font-size: 0.75rem;
            font-weight: 400;
            color: #9a8fc2;
        }

        /* ── Chart card ───────────────────────────────────────── */
        .chart-wrap {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 20px 24px 16px;
        }

        /* ── Floating label strip ─────────────────────────────── */
        .label-strip {
            position: relative;
            height: 86px;
            margin-bottom: 6px;
            pointer-events: none;
        }

        .event-box {
            position: absolute;
            top: 0;
            transform: translateX(-50%);
            background: rgba(14, 10, 40, 0.88);
            border: 1px solid rgba(255,255,255,0.14);
            border-radius: 10px;
            padding: 7px 13px 8px;
            text-align: center;
            min-width: 108px;
            white-space: nowrap;
        }

        .eb-title {
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #9a8fc2;
            margin-bottom: 3px;
        }

        .eb-year {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            line-height: 1;
            margin-bottom: 5px;
        }

        .eb-row {
            font-size: 11px;
            line-height: 1.55;
        }

        .eb-sep {
            height: 1px;
            background: rgba(167,139,250,0.25);
            margin: 3px 4px;
        }

        .jon-color   { color: #60a5fa; }
        .grace-color { color: #f9a8d4; }
        .avg-color   { color: #a78bfa; }

        /* ── Chart canvas area ────────────────────────────────── */
        .chart-container { position: relative; height: 400px; }

        /* ── Summary row ──────────────────────────────────────── */
        .summary {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }

        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: 700; }
        .stat-label {
            font-size: 0.78rem;
            color: #9a8fc2;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 2px;
        }

        .green { color: #4ade80; }
        .blue  { color: #60a5fa; }
        .amber { color: #fbbf24; }
        .red   { color: #f87171; }

        @media (max-width: 700px) {
            body { padding: 14px; }
            h1 { font-size: 1.4rem; }
            .controls { grid-template-columns: 1fr; }
            .summary { gap: 18px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Wealth Planning</h1>

    <!-- Row 1: Numeric inputs -->
    <div class="controls">
        <div class="control-group">
            <label for="netWorth">Current Net Worth ($)</label>
            <input type="text" id="netWorth" value="1,000,000">
        </div>
        <div class="control-group">
            <label for="income">Annual Income ($)</label>
            <input type="text" id="income" value="250,000">
        </div>
        <div class="control-group">
            <label for="retirementSpending">Annual Spending in Retirement ($)</label>
            <input type="text" id="retirementSpending" value="150,000">
        </div>
    </div>

    <!-- Row 2: Sliders -->
    <div class="controls" style="margin-bottom: 28px;">
        <div class="control-group">
            <label for="savingsRate">Savings Rate (pre-retirement)</label>
            <div class="slider-wrap">
                <input type="range" id="savingsRate" min="0" max="80" value="20" step="1">
                <span class="slider-value" id="savingsRateVal">20%</span>
            </div>
        </div>
        <div class="control-group">
            <label for="retireAge">Target Retirement Age</label>
            <div class="slider-wrap">
                <input type="range" id="retireAge" min="45" max="80" value="65" step="1">
                <span class="slider-value" id="retireAgeVal">Ave. Age 65<span class="sub" id="retireYearHint">(Year 2053)</span></span>
            </div>
        </div>
        <div class="control-group">
            <label for="returnRate">Annual Return, Net of Inflation</label>
            <div class="slider-wrap">
                <input type="range" id="returnRate" min="0" max="10" value="3" step="0.5">
                <span class="slider-value" id="returnRateVal">3.0%</span>
            </div>
        </div>
    </div>

    <div class="chart-wrap">

        <!-- Floating label strip — boxes live here, positioned by JS -->
        <div class="label-strip" id="labelStrip">

            <div class="event-box" id="retireBox">
                <div class="eb-title">Retirement</div>
                <div class="eb-year" id="rYear"></div>
                <div class="eb-row jon-color"   id="rJon"></div>
                <div class="eb-row grace-color" id="rGrace"></div>
                <div class="eb-sep"></div>
                <div class="eb-row avg-color"   id="rAvg"></div>
            </div>

            <div class="event-box" id="depleteBox" style="display:none">
                <div class="eb-title">Money Runs Out</div>
                <div class="eb-year" id="dYear"></div>
                <div class="eb-row jon-color"   id="dJon"></div>
                <div class="eb-row grace-color" id="dGrace"></div>
                <div class="eb-sep"></div>
                <div class="eb-row avg-color"   id="dAvg"></div>
            </div>

        </div>

        <div class="chart-container">
            <canvas id="chart"></canvas>
        </div>

        <div class="summary" id="summary"></div>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);

const START_YEAR     = 2026;
const END_YEAR       = 2090;
const JON_AGE_2026   = 40;
const GRACE_AGE_2026 = 37;

function ages(year) {
    const d = year - START_YEAR;
    return {
        jon:   JON_AGE_2026   + d,
        grace: GRACE_AGE_2026 + d,
        avg:   Math.ceil((JON_AGE_2026 + GRACE_AGE_2026 + d * 2) / 2),
    };
}

function ageToYear(age) { return Math.round(START_YEAR + age - 38.5); }

// ── Number formatting ─────────────────────────────────────────────────────────
function parseNum(s)  { return parseFloat(String(s).replace(/,/g, '')) || 0; }
function formatNum(n) { const v = parseNum(n); return isNaN(v) ? '' : v.toLocaleString('en-US'); }

['netWorth', 'income', 'retirementSpending'].forEach(id => {
    const el = $(id);
    el.addEventListener('focus', function() { this.value = String(parseNum(this.value) || ''); });
    el.addEventListener('blur',  function() {
        const n = parseNum(this.value);
        if (n > 0) this.value = formatNum(n);
        compute();
    });
    el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
});

// ── Tick years ────────────────────────────────────────────────────────────────
const tickYears = [START_YEAR];
for (let y = 2030; y <= END_YEAR; y += 5) tickYears.push(y);

// ── Age axis plugin ───────────────────────────────────────────────────────────
const ROW_H = 17;

const ageAxisPlugin = {
    id: 'ageAxis',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !y) return;
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.font = '10px system-ui, sans-serif';

        const baseY = x.bottom + 6;

        tickYears.forEach(year => {
            const xPos = x.getPixelForValue(year);
            const { jon, grace, avg } = ages(year);

            ctx.fillStyle = '#60a5fa';
            ctx.fillText(jon,   xPos, baseY);

            ctx.fillStyle = '#f9a8d4';
            ctx.fillText(grace, xPos, baseY + ROW_H);

            ctx.strokeStyle = 'rgba(167,139,250,0.25)';
            ctx.lineWidth = 0.75;
            ctx.beginPath();
            ctx.moveTo(x.left,  baseY + ROW_H * 2 - 3);
            ctx.lineTo(x.right, baseY + ROW_H * 2 - 3);
            ctx.stroke();

            ctx.fillStyle = '#a78bfa';
            ctx.fillText(avg, xPos, baseY + ROW_H * 2);
        });

        const labelX = y.left - 8;
        ctx.textAlign = 'right';
        ctx.font = '9px system-ui, sans-serif';
        ctx.fillStyle = '#60a5fa';  ctx.fillText('Jon',   labelX, baseY);
        ctx.fillStyle = '#f9a8d4';  ctx.fillText('Grace', labelX, baseY + ROW_H);
        ctx.fillStyle = '#a78bfa';  ctx.fillText('Avg',   labelX, baseY + ROW_H * 2);
        ctx.restore();
    }
};

// ── Retirement dashed line ────────────────────────────────────────────────────
const retireLinePlugin = {
    id: 'retireLine',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !chart._retireYear) return;
        const xPos = x.getPixelForValue(chart._retireYear);
        if (xPos < x.left || xPos > x.right) return;
        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = 'rgba(251,191,36,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(xPos, y.top);
        ctx.lineTo(xPos, y.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }
};

// ── Depletion dashed line ─────────────────────────────────────────────────────
const depletionLinePlugin = {
    id: 'depletionLine',
    afterDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        if (!x || !chart._depletedYearPrecise) return;
        const xPos = x.getPixelForValue(chart._depletedYearPrecise);
        if (xPos < x.left || xPos > x.right) return;
        ctx.save();
        ctx.setLineDash([6, 4]);
        ctx.strokeStyle = 'rgba(248,113,113,0.55)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(xPos, y.top);
        ctx.lineTo(xPos, y.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
    }
};

// ── Chart setup ───────────────────────────────────────────────────────────────
const canvasEl = $('chart');
const ctx      = canvasEl.getContext('2d');

const chart = new Chart(ctx, {
    type: 'line',
    plugins: [ageAxisPlugin, retireLinePlugin, depletionLinePlugin],
    data: { datasets: [{ label: 'Net Worth', data: [], pointRadius: 0, pointHoverRadius: 0 }] },
    options: {
        responsive: true,
        maintainAspectRatio: false,
        layout: { padding: { top: 8, bottom: 60, left: 52 } },
        interaction: { intersect: false, mode: 'index' },
        plugins: {
            legend: { display: false },
            tooltip: {
                backgroundColor: 'rgba(30,20,60,0.92)',
                titleColor: '#b0a8d0',
                bodyColor: '#fff',
                bodyFont: { size: 13, weight: '600' },
                padding: 12,
                cornerRadius: 10,
                callbacks: {
                    title: items => {
                        const year = Math.round(items[0].parsed.x);
                        const { jon, grace, avg } = ages(year);
                        return `${year}  ·  Jon ${jon}  Grace ${grace}  Avg ${avg}`;
                    },
                    label: item => {
                        const v = item.parsed.y;
                        return (v >= 0 ? '$' : '-$') +
                            Math.abs(v).toLocaleString('en-US', { maximumFractionDigits: 0 });
                    }
                }
            }
        },
        scales: {
            x: {
                type: 'linear',
                min: START_YEAR,
                max: END_YEAR,
                beforeUpdate(axis) { axis.options.ticks.maxTicksLimit = tickYears.length + 1; },
                afterBuildTicks(axis) { axis.ticks = tickYears.map(v => ({ value: v })); },
                ticks: { maxRotation: 0, color: '#8a80b0', callback: val => val },
                grid:  { color: 'rgba(255,255,255,0.04)' },
            },
            y: {
                ticks: {
                    color: '#8a80b0',
                    callback: v => {
                        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
                        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(0) + 'K';
                        return v;
                    }
                },
                grid: { color: 'rgba(255,255,255,0.04)' },
            }
        }
    }
});

// ── Position the floating label boxes ────────────────────────────────────────
function updateBoxPositions() {
    const x = chart.scales?.x;
    if (!x) return;

    const stripW = $('labelStrip').offsetWidth;

    // Retirement box
    const rb   = $('retireBox');
    const retX = x.getPixelForValue(chart._retireYear);
    const rbHW = rb.offsetWidth / 2;
    rb.style.left = Math.max(rbHW, Math.min(stripW - rbHW, retX)) + 'px';

    // Depletion box
    const db = $('depleteBox');
    if (chart._depletedYearPrecise) {
        db.style.display = '';
        const depX = x.getPixelForValue(chart._depletedYearPrecise);
        const dbHW = db.offsetWidth / 2;
        db.style.left = Math.max(dbHW, Math.min(stripW - dbHW, depX)) + 'px';
    } else {
        db.style.display = 'none';
    }
}

// ── Compute & render ──────────────────────────────────────────────────────────
function compute() {
    const netWorth0   = parseNum($('netWorth').value);
    const income      = parseNum($('income').value);
    const returnPct   = parseFloat($('returnRate').value) / 100;
    const savePct     = parseInt($('savingsRate').value) / 100;
    const retireAge   = parseInt($('retireAge').value);
    const retireSpend = parseNum($('retirementSpending').value);
    const retireYear  = ageToYear(retireAge);

    // Slider labels
    $('savingsRateVal').textContent = $('savingsRate').value + '%';
    $('returnRateVal').textContent  = parseFloat($('returnRate').value).toFixed(1) + '%';
    $('retireAgeVal').childNodes[0].textContent = 'Age ' + retireAge;
    $('retireYearHint').textContent = '(Year ' + retireYear + ')';

    // Build projection
    const data = [];
    let nw = netWorth0, peakNW = nw, peakYear = START_YEAR, depletedYear = null;

    for (let y = START_YEAR; y <= END_YEAR; y++) {
        data.push({ x: y, y: Math.round(nw) });
        if (nw > peakNW) { peakNW = nw; peakYear = y; }
        if (nw <= 0 && y >= retireYear && !depletedYear) depletedYear = y;
        nw = y < retireYear
            ? (nw + income * savePct) * (1 + returnPct)
            : (nw - retireSpend)      * (1 + returnPct);
    }

    // Interpolated zero-crossing for line/box alignment
    let depletedYearPrecise = null;
    if (depletedYear !== null && depletedYear > START_YEAR) {
        const d0 = data[depletedYear - 1 - START_YEAR];
        const d1 = data[depletedYear - START_YEAR];
        depletedYearPrecise = (d0 && d1 && d0.y > 0)
            ? d0.x + d0.y / (d0.y - d1.y)
            : depletedYear;
    }

    // Gradient fill
    const gradient = ctx.createLinearGradient(0, 0, 0, canvasEl.clientHeight);
    gradient.addColorStop(0, 'rgba(123,47,247,0.28)');
    gradient.addColorStop(1, 'rgba(123,47,247,0.0)');

    const ds = chart.data.datasets[0];
    Object.assign(ds, {
        data, borderColor: '#7b2ff7', backgroundColor: gradient,
        fill: true, pointRadius: 0, pointHoverRadius: 0,
        borderWidth: 3, tension: 0.3,
        segment: { borderColor: seg => seg.p1.parsed.y < 0 ? '#f87171' : '#7b2ff7' },
    });

    chart._retireYear          = retireYear;
    chart._depletedYear        = depletedYear;
    chart._depletedYearPrecise = depletedYearPrecise;
    chart.update('none');

    // Populate label box content
    const ra = ages(retireYear);
    $('rYear').textContent  = retireYear;
    $('rJon').textContent   = 'Jon  '   + ra.jon;
    $('rGrace').textContent = 'Grace  ' + ra.grace;
    $('rAvg').textContent   = 'Avg  '   + ra.avg;

    if (depletedYear) {
        const da = ages(depletedYear);
        $('dYear').textContent  = depletedYear;
        $('dJon').textContent   = 'Jon  '   + da.jon;
        $('dGrace').textContent = 'Grace  ' + da.grace;
        $('dAvg').textContent   = 'Avg  '   + da.avg;
    }

    updateBoxPositions();

    // Summary stats
    const retireNW      = data[Math.min(retireYear - START_YEAR, data.length - 1)]?.y ?? 0;
    const yearsOfWealth = depletedYear ? depletedYear - retireYear : '∞';
    const depletedAge   = depletedYear ? ages(depletedYear).avg : null;

    const fmt = v => {
        const neg = v < 0, a = Math.abs(v);
        const s = a >= 1e6 ? '$' + (a/1e6).toFixed(1) + 'M'
                : a >= 1e3 ? '$' + (a/1e3).toFixed(0) + 'K'
                : '$' + a.toLocaleString();
        return neg ? '-' + s : s;
    };

    $('summary').innerHTML = `
        <div class="stat">
            <div class="stat-value blue">${fmt(retireNW)}</div>
            <div class="stat-label">Net Worth at Retirement</div>
        </div>
        <div class="stat">
            <div class="stat-value amber">${yearsOfWealth === '∞' ? '∞' : yearsOfWealth + ' yrs'}</div>
            <div class="stat-label">Years of Retirement Funded</div>
        </div>
    `;
}

['savingsRate', 'retireAge', 'returnRate'].forEach(id => $(id).addEventListener('input', compute));
window.addEventListener('resize', updateBoxPositions);

compute();
</script>

</body>
</html>
